function completed(key){switch(key){case'goals':return !!state.readDone.goals;case'warmup':return state.warmup!==null;case'parts':return state.parts.length===3;case'length':return state.lengthAnswer!==null;case'tracing':return state.traceStep>=3 && state.traceAnswer!==null;case'practiceA':return state.practiceA!==null;case'practiceB':return state.practiceB!==null;case'practiceC':return state.ordering.every(Boolean);case'quiz':return state.quizSubmitted && state.quizAnswers.every(x=>x!==null);case'reflection':return state.reflection.trim().length>=10;case'homework':return state.homeworkSeen;case'results':return requirementsMet();default:return false;}}

function doneCount(){return required.filter(s=>completed(s.key)).length;}

function quizScore(){return QUESTIONS.reduce((n,q,i)=>n+(state.quizAnswers[i]===q.correct?1:0),0);}

 for(const el of document.querySelectorAll('input[type=radio][name=warmup],input[type=radio][name=lengthAnswer],input[type=radio][name=traceAnswer],input[type=radio][name=practiceA],input[type=radio][name=practiceB]')){el.addEventListener('change',()=>{state[el.name]=Number(el.value);render();});}

function messageFor(k){return ({warmup:'Choose an answer to complete your warm-up.',parts:'Explore the vertex, arms and opening first.',length:'Choose an answer about arm length.',tracing:'Complete the tracing steps and answer the comparison question.',practiceA:'Choose an answer to finish Practice 1.',practiceB:'Choose an answer to finish Practice 2.',practiceC:'Choose an option for FIRST, SECOND and THIRD.',quiz:'Finish and submit all 10 quiz questions.',reflection:'Write at least 10 characters explaining how you compare angles.'})[k]||'Complete the current task first.';}
/* Genuine Excel export, self-contained: XML SpreadsheetML zipped with ZIP Store entries + CRC32.
   No CSV, network requests, CDN, external package, or persistent storage. */
const encoder=new TextEncoder();
const int16=(n)=>[n&255,(n>>>8)&255];
const int32=(n)=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
function crc32(buf){let c=0xffffffff;for(let i=0;i<buf.length;i++){c^=buf[i];for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0);}return(c^0xffffffff)>>>0;}
function zipStore(files){let chunks=[],central=[],offset=0;for(const f of files){const name=encoder.encode(f.name),bytes=encoder.encode(f.xml),crc=crc32(bytes),size=bytes.length;const local=new Uint8Array([80,75,3,4,...int16(20),...int16(0x0800),...int16(0),...int16(0),...int16(0),...int32(crc),...int32(size),...int32(size),...int16(name.length),...int16(0)]);chunks.push(local,name,bytes);const entry=new Uint8Array([80,75,1,2,...int16(20),...int16(20),...int16(0x0800),...int16(0),...int16(0),...int16(0),...int32(crc),...int32(size),...int32(size),...int16(name.length),...int16(0),...int16(0),...int16(0),...int16(0),...int32(0),...int32(offset)]);central.push(entry,name);offset+=local.length+name.length+size;}
 const centralSize=central.reduce((x,b)=>x+b.length,0);const end=new Uint8Array([80,75,5,6,...int16(0),...int16(0),...int16(files.length),...int16(files.length),...int32(centralSize),...int32(offset),...int16(0)]);return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
function xml(t){return String(t??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));}
function colRef(n){let s='';do{s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)-1;}while(n>=0);return s;}
function cellXml(value,r,c,sty=3){let addr=`${colRef(c)}${r}`;if(value===null||value===undefined)return `<c r="${addr}" s="${sty}"/>`;if(typeof value==='number'&&isFinite(value))return `<c r="${addr}" s="${sty}"><v>${value}</v></c>`;return `<c r="${addr}" s="${sty}" t="inlineStr"><is><t xml:space="preserve">${xml(value)}</t></is></c>`;}
